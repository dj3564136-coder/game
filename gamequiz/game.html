<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History Educational Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  padding: 10px;
  background-image:url(grunge-paper-background.jpg) ;
}

/* Header/Blog Title */
.header {
  padding: 30px;
  text-align: center;
  background-image:url(grunge-paper-background.jpg) ;
  
}

.header h1 {
  font-size: 50px;
}

/* Style the top navigation bar */
.topnav {
  overflow: hidden;
  background-color: #333;
}

/* Style the topnav links */
.topnav a {
  float: left;
  display: block;
  color: #f2f2f2;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

/* Change color on hover */
.topnav a:hover {
  background-color: #ddd;
  color: black;
}

/* Left column */
.leftcolumn {   
  float: left;
  width: 100%;
}

/* Right column */
.rightcolumn {
  float: left;
  width: 25%;
  background-color: #f1f1f1;
  padding-left: 20px;
}

/* Fake image */
.fakeimg {
  background-color: #aaa;
  width: 100%;
  padding: 20px;
}

/* Add a card effect for articles */
.card {
  background-image:url(grunge-paper-background.jpg) ;
  padding: 20px;
  margin-top: 20px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* Footer */
.footer {
  padding: 20px;
  text-align: center;
  background-image:url(grunge-paper-background.jpg) ;
  margin-top: 20px;
}

/* Quiz Styling */
.quiz-box {
  max-width: 650px;
  margin: 0 auto;
  text-align: left;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #f1f1f1;
  padding-bottom: 10px;
  margin-bottom: 20px;
}

.question-text {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  padding: 14px 18px;
  font-size: 16px;
  text-align: left;
  background-color: #f9f9f9;
  border: 2px solid #ddd;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}

.option-btn:hover:not(:disabled) {
  background-color: #e9ecef;
  border-color: #333;
}

.option-btn.correct {
  background-color: #d4edda;
  border-color: #28a745;
  color: #155724;
  font-weight: bold;
}

.option-btn.wrong {
  background-color: #f8d7da;
  border-color: #dc3545;
  color: #721c24;
}

.option-btn:disabled {
  cursor: default;
}

.feedback {
  margin-top: 15px;
  font-size: 16px;
  font-weight: bold;
  min-height: 24px;
}

.next-btn, .restart-btn {
  margin-top: 15px;
  padding: 12px 24px;
  font-size: 16px;
  background-color: #333;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  display: none;
}

.next-btn:hover, .restart-btn:hover {
  background-color: #555;
}

.result-box {
  text-align: center;
  padding: 20px 0;
  display: none;
}

/* Responsive layout */
@media screen and (max-width: 800px) {
  .leftcolumn, .rightcolumn {   
    width: 100%;
    padding: 0;
  }
}

@media screen and (max-width: 400px) {
  .topnav a {
    float: none;
    width: 100%;
  }
}
</style>
</head>

<body onload="startQuiz()">

<div class="header">
    <h1>
  <img src="image_2873f47d.jpg" alt="Brand Logo" style="height: 2em; width: auto; vertical-align: middle;">
</h1>
  <h1>Quizruns</h1>
  <p>History Educational Quiz</p>
</div>

<div class="row">
  <div class="leftcolumn">
    <div class="card">
      <div class="quiz-box">
        <div class="quiz-header">
          <span id="progressText">Question 1 of 5</span>
          <span id="scoreText">Score: 0</span>
        </div>

        <div id="quizContent">
          <div class="question-text" id="questionText"></div>
          <div class="options-list" id="optionsList"></div>
          <div class="feedback" id="feedbackText"></div>
          <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>

        <div class="result-box" id="resultBox">
          <h2>Quiz Complete!</h2>
          <p id="finalScoreText" style="font-size: 20px;"></p>
          <button class="restart-btn" id="restartBtn" style="display: inline-block;" onclick="startQuiz()">Play Again</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
    <p></p>
    <p>Email: arwindanea@gmail.com</p>
    <p>Phone: 09914140089</p>
  <p>Made on 11/21/2026</p>
  <p></p>

</div>

<script>
var quizQuestions = [
  {
    question: "1. In what year did World War II end?",
    options: ["1942", "1945", "1948", "1950"],
    correct: 1
  },
  {
    question: "2. Who wrote 'Noli Me Tángere'?",
    options: ["Andres Bonifacio", "Emilio Aguinaldo", "José Rizal", "Apolinario Mabini"],
    correct: 2
  },
  {
    question: "3. Which ancient civilization built the pyramids of Giza?",
    options: ["Egyptians", "Romans", "Greeks", "Mayans"],
    correct: 0
  },
  {
    question: "4. When was Philippine Independence proclaimed?",
    options: ["June 12, 1898", "July 4, 1946", "August 21, 1983", "February 25, 1986"],
    correct: 0
  },
  {
    question: "5. Who was the first person to walk on the Moon?",
    options: ["Buzz Aldrin", "Yuri Gagarin", "Michael Collins", "Neil Armstrong"],
    correct: 3
  }
];

var currentQuestion = 0;
var score = 0;

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  document.getElementById("quizContent").style.display = "block";
  document.getElementById("resultBox").style.display = "none";
  loadQuestion();
}

function loadQuestion() {
  var q = quizQuestions[currentQuestion];
  document.getElementById("progressText").innerText = "Question " + (currentQuestion + 1) + " of " + quizQuestions.length;
  document.getElementById("scoreText").innerText = "Score: " + score;
  document.getElementById("questionText").innerText = q.question;
  document.getElementById("feedbackText").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  var optionsList = document.getElementById("optionsList");
  optionsList.innerHTML = "";

  for (var i = 0; i < q.options.length; i++) {
    var btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = q.options[i];
    btn.setAttribute("onclick", "checkAnswer(" + i + ", this)");
    optionsList.appendChild(btn);
  }
}

function checkAnswer(selectedIndex, selectedBtn) {
  var q = quizQuestions[currentQuestion];
  var buttons = document.querySelectorAll(".option-btn");
  var feedback = document.getElementById("feedbackText");

  for (var i = 0; i < buttons.length; i++) {
    buttons[i].disabled = true;
    if (i === q.correct) {
      buttons[i].classList.add("correct");
    }
  }

  if (selectedIndex === q.correct) {
    score++;
    document.getElementById("scoreText").innerText = "Score: " + score;
    feedback.style.color = "#155724";
    feedback.innerText = "Correct!";
  } else {
    selectedBtn.classList.add("wrong");
    feedback.style.color = "#721c24";
    feedback.innerText = "Wrong! The correct answer is highlighted in green.";
  }

  document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion < quizQuestions.length) {
    loadQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("resultBox").style.display = "block";
  document.getElementById("finalScoreText").innerText = "You scored " + score + " out of " + quizQuestions.length + "!";
}
</script>

</body>
</html>
